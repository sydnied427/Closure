kind = "web"
previewPath = "/closure/"
title = "Closure"
version = "1.0.0"
id = "artifacts/closure"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/closure/" ]
localPort = 22775

[services.development]
run = "pnpm --filter @workspace/closure run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/closure", "run", "build" ]
publicDir = "artifacts/closure/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22775"
BASE_PATH = "/closure/"

kind = "web"
previewPath = "/"
title = "Last Words"
version = "1.0.0"
id = "artifacts/last-words"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23352

[services.development]
run = "pnpm --filter @workspace/last-words run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/last-words", "run", "build" ]
publicDir = "artifacts/last-words/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23352"
BASE_PATH = "/"

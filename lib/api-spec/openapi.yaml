openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Waitlist operations
  - name: letters
    description: Letter operations
  - name: closure
    description: Closure app operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "200":
          description: Successfully joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
        "409":
          description: Email already on waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters:
    post:
      operationId: createLetter
      tags: [letters]
      summary: Seal a letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLetterRequest"
      responses:
        "201":
          description: Letter sealed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLetterResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /closure/boxes:
    post:
      operationId: createClosureBox
      tags: [closure]
      summary: Create a closure box
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClosureBoxRequest"
      responses:
        "201":
          description: Box created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateClosureBoxResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /closure/boxes/{sessionId}:
    get:
      operationId: listClosureBoxes
      tags: [closure]
      summary: List boxes for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of boxes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClosureBoxesResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    CreateLetterRequest:
      type: object
      properties:
        recipient:
          type: string
        body:
          type: string
        deliveryType:
          type: string
          enum: [date, sealed]
        deliveryDate:
          type: string
          nullable: true
        audioData:
          type: string
          nullable: true
        videoData:
          type: string
          nullable: true
      required:
        - recipient
        - body
        - deliveryType
    CreateLetterResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
        message:
          type: string
      required:
        - success
        - id
        - message
    CreateClosureBoxRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: Client-generated UUID for session tracking
        theme:
          type: string
          enum: [classic, modern, dark, floral]
        intention:
          type: string
          enum: [grief, gratitude, love, anger, forgiveness, estrangement]
        recipientName:
          type: string
        letterContent:
          type: string
        fate:
          type: string
          enum: [seal, open_on_date, release]
        fateDate:
          type: string
          nullable: true
          description: ISO date string, required when fate is open_on_date
        audioData:
          type: string
          nullable: true
          description: Base64 audio
        photoData:
          type: string
          nullable: true
          description: Base64 image
        videoData:
          type: string
          nullable: true
          description: Base64 video
      required:
        - sessionId
        - theme
        - intention
        - recipientName
        - letterContent
        - fate
    CreateClosureBoxResponse:
      type: object
      properties:
        success:
          type: boolean
        boxId:
          type: integer
        sessionId:
          type: string
      required:
        - success
        - boxId
        - sessionId
    ClosureBox:
      type: object
      properties:
        id:
          type: integer
        theme:
          type: string
        intention:
          type: string
        recipientName:
          type: string
        fate:
          type: string
        fateDate:
          type: string
          nullable: true
        hasAudio:
          type: boolean
        hasPhoto:
          type: boolean
        hasVideo:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - theme
        - intention
        - recipientName
        - fate
        - hasAudio
        - hasPhoto
        - hasVideo
        - createdAt
    ListClosureBoxesResponse:
      type: object
      properties:
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/ClosureBox"
      required:
        - boxes
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Waitlist operations
  - name: letters
    description: Letter operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join waitlist
      description: Submit an email address to join the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "200":
          description: Successfully joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
        "409":
          description: Email already on waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters:
    post:
      operationId: createLetter
      tags: [letters]
      summary: Seal a letter
      description: Save a letter with recipient, body, delivery option, and optional media attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLetterRequest"
      responses:
        "201":
          description: Letter sealed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLetterResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    CreateLetterRequest:
      type: object
      properties:
        recipient:
          type: string
        body:
          type: string
        deliveryType:
          type: string
          enum: [date, sealed]
        deliveryDate:
          type: string
          nullable: true
          description: ISO date string, required when deliveryType is "date"
        audioData:
          type: string
          nullable: true
          description: Base64-encoded audio data
        videoData:
          type: string
          nullable: true
          description: Base64-encoded video data
      required:
        - recipient
        - body
        - deliveryType
    CreateLetterResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
        message:
          type: string
      required:
        - success
        - id
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

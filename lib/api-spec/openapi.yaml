openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Waitlist operations
  - name: letters
    description: Letter operations
  - name: closure
    description: Closure app operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "200":
          description: Successfully joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
        "409":
          description: Email already on waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /letters:
    post:
      operationId: createLetter
      tags: [letters]
      summary: Seal a letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLetterRequest"
      responses:
        "201":
          description: Letter sealed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLetterResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /closure/boxes:
    post:
      operationId: createClosureBox
      tags: [closure]
      summary: Create a closure box
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClosureBoxRequest"
      responses:
        "201":
          description: Box created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateClosureBoxResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /closure/boxes/{sessionId}:
    get:
      operationId: listClosureBoxes
      tags: [closure]
      summary: List boxes for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of boxes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClosureBoxesResponse"
  /closure/me/boxes:
    get:
      operationId: listMyClosureBoxes
      tags: [closure]
      summary: List boxes for the authenticated user (includes their sessionId boxes)
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of boxes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClosureBoxesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid required fields.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Token did not contain usable claims.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Token exchange failed.
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WaitlistResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    CreateLetterRequest:
      type: object
      properties:
        recipient:
          type: string
        body:
          type: string
        deliveryType:
          type: string
          enum: [date, sealed]
        deliveryDate:
          type: string
          nullable: true
        audioData:
          type: string
          nullable: true
        videoData:
          type: string
          nullable: true
      required:
        - recipient
        - body
        - deliveryType
    CreateLetterResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
        message:
          type: string
      required:
        - success
        - id
        - message
    CreateClosureBoxRequest:
      type: object
      properties:
        sessionId:
          type: string
        theme:
          type: string
          enum: [classic, modern, dark, floral]
        intention:
          type: string
          enum: [grief, gratitude, love, anger, forgiveness, estrangement]
        recipientName:
          type: string
        letterContent:
          type: string
        fate:
          type: string
          enum: [seal, open_on_date, release]
        fateDate:
          type: string
          nullable: true
        audioData:
          type: string
          nullable: true
        photoData:
          type: string
          nullable: true
        videoData:
          type: string
          nullable: true
      required:
        - sessionId
        - theme
        - intention
        - recipientName
        - letterContent
        - fate
    CreateClosureBoxResponse:
      type: object
      properties:
        success:
          type: boolean
        boxId:
          type: integer
        sessionId:
          type: string
      required:
        - success
        - boxId
        - sessionId
    ClosureBox:
      type: object
      properties:
        id:
          type: integer
        theme:
          type: string
        intention:
          type: string
        recipientName:
          type: string
        fate:
          type: string
        fateDate:
          type: string
          nullable: true
        hasAudio:
          type: boolean
        hasPhoto:
          type: boolean
        hasVideo:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - theme
        - intention
        - recipientName
        - fate
        - hasAudio
        - hasPhoto
        - hasVideo
        - createdAt
    ListClosureBoxesResponse:
      type: object
      properties:
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/ClosureBox"
      required:
        - boxes
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
